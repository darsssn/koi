    <script>
        // Draft History
        document.addEventListener('DOMContentLoaded', function () {
            loadDraftHistory();
        });
        
        // Load and Display Draft History
        function loadDraftHistory() {
            const textbox = document.getElementById('inputText');
            if (!textbox) {
                console.warn('Draft history textarea #inputText not found.');
                return;
            }
            const historyKey = 'koi_draft_history';
            let history = [];

            // Read history from localStorage
            try {
                const savedHistory =
                    localStorage.getItem(historyKey);
                if (savedHistory) {
                    history = JSON.parse(savedHistory);
                }
                if (!Array.isArray(history)) {
                    history = [];
                }
            } catch (error) {
                console.error(
                    'Could not read draft history:',
                    error
                );
                history = [];
            }

            // Nothing to display
            if (history.length === 0) {
                textbox.value = '';
                return;
            }

            // Display newest history first
            const reversedHistory = [...history].reverse();
            const output = reversedHistory.map(function (entry) {
                const timestamp =
                    formatHistoryDate(entry.timestamp);
                return (
                    `--------------- Draft_${entry.draft} (${timestamp}) ---------------\n` +
                    `${entry.content}\n`
                );
            }).join('\n');
            textbox.value = output;
        }

        // Format History Date
        function formatHistoryDate(timestamp) {
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) {
                return 'Unknown date';
            }
            const day =
                String(date.getDate()).padStart(2, '0');
            const month =
                String(date.getMonth() + 1).padStart(2, '0');
            const year =
                date.getFullYear();
            const hours =
                String(date.getHours()).padStart(2, '0');
            const minutes =
                String(date.getMinutes()).padStart(2, '0');
            const seconds =
                String(date.getSeconds()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
        }
    </script>
